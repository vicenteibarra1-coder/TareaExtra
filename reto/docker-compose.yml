# Reto "Operación Red Fantasma" — mini-red para el bonus del Solemne 1.
# Levanta con:  ESTUDIANTE="12.345.678-9" docker compose up -d --build
# (o copia .env.ejemplo a .env y edita tu RUT)

services:
  servidor:
    build: { context: ., dockerfile: Dockerfile.svc }
    container_name: servidor
    command: python servidor.py
    environment:
      ESTUDIANTE: "${ESTUDIANTE}"
      RETO_SECRET: "${RETO_SECRET:-red-fantasma-2026-EIT-UDP}"
    networks:
      retonet: { ipv4_address: 172.28.0.10 }

  cliente:
    build: { context: ., dockerfile: Dockerfile.svc }
    container_name: cliente
    command: python cliente.py
    environment:
      ESTUDIANTE: "${ESTUDIANTE}"
      RETO_SECRET: "${RETO_SECRET:-red-fantasma-2026-EIT-UDP}"
      SERVIDOR: "http://172.28.0.10:8080"
    depends_on: [servidor]
    networks:
      retonet: { ipv4_address: 172.28.0.20 }

  oraculo:
    build: { context: ., dockerfile: Dockerfile.svc }
    container_name: oraculo
    command: python oraculo.py
    environment:
      ESTUDIANTE: "${ESTUDIANTE}"
      RETO_SECRET: "${RETO_SECRET:-red-fantasma-2026-EIT-UDP}"
    networks:
      retonet: { ipv4_address: 172.28.0.30 }

  atacante:
    build: { context: ., dockerfile: Dockerfile.atacante }
    container_name: atacante
    cap_add: [NET_ADMIN, NET_RAW]   # para ARP spoofing y sniffing
    sysctls:
      net.ipv4.ip_forward: 1        # reenvío activado (necesario para el MITM)
    volumes:
      - ./:/reto                    # tus scripts: editas en el navegador, corres aquí
    working_dir: /reto
    tty: true
    stdin_open: true
    networks:
      retonet: { ipv4_address: 172.28.0.40 }

networks:
  retonet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
